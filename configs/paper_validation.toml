[paper]
arxiv_id = "2504.11393v2"
source_url = "https://arxiv.org/e-print/2504.11393v2"
archive_sha256 = "20dc7aa3f920fe465ddf2e12d6f72fff6e8bb3567f53e34f5555a6da138542d1"
source_root = "docs/paper"
entrypoint = "example_paper.tex"

[[inputs]]
id = "olmes_tasks"
path = "processed/olmes-details/{recipe}/tasks.parquet"
remote_path = "olmes-details/{recipe}/tasks.parquet"
columns = ["recipe", "params", "seed", "step", "tokens", "compute", "task", "primary_metric", "acc_raw", "acc_per_token", "acc_per_char", "primary_score"]

[[inputs]]
id = "olmes_choices"
path = "processed/olmes-details/{recipe}/choices.parquet"
remote_path = "olmes-details/{recipe}/choices.parquet"
columns = ["recipe", "params", "seed", "step", "task", "doc_id", "choice_index", "sum_logits", "num_tokens", "num_chars", "is_greedy", "sum_logits_uncond", "logits_per_token", "logits_per_char"]

[[inputs]]
id = "scaling_evaluations"
path = "processed/scaling-law/evaluations.parquet"
remote_path = "scaling-law/evaluations.parquet"
columns = ["recipe", "params", "seed", "step", "task", "tokens", "compute", "exact_parameter_count", "primary_metric"]

[[inputs]]
id = "scaling_checkpoint_losses"
path = "processed/scaling-law/checkpoint-losses.parquet"
remote_path = "scaling-law/checkpoint-losses.parquet"
columns = ["recipe", "params", "seed", "step", "tokens", "compute", "exact_parameter_count", "c4_en_validation_cross_entropy", "dolma_common_crawl_validation_cross_entropy", "pile_validation_cross_entropy", "wikitext_103_validation_cross_entropy", "train_cross_entropy"]

[[comparison_rules]]
id = "predicate-true-v1"
version = 1
predicate = "boolean_true"

[[comparison_rules]]
id = "directional-v1"
version = 1
predicate = "directional"

[[comparison_rules]]
id = "nonempty-paper-plot-v1"
version = 1
predicate = "nonempty_plot"

[[comparison_rules]]
id = "approximately-one-point-v1"
version = 1
predicate = "absolute_tolerance"
absolute_tolerance = 0.01
threshold_grid = [0.005, 0.01, 0.02]

[[comparison_rules]]
id = "rounded-one-decimal-v1"
version = 1
predicate = "rounded"
displayed_decimal_places = 1

[checkpoint_policy]
final_rule = "latest_common_complete"
completeness_dimensions = ["recipe", "seed", "task", "metric"]
one_step_across_universe = true

[sensitivity_policy]
preceding_common_complete_steps = 2
include_paper_step_when_present = true
fixed_before_computation = true

[[analysis_policies]]
id = "single_scale"
transformation_ids = ["mmlu-subject-macro-v1", "olmes-task-macro-v1", "recipe-ranking-v1", "unordered-pair-accuracy-v1"]

[[analysis_policies]]
id = "per_task"
transformation_ids = ["task-score-v1", "recipe-ranking-v1", "unordered-pair-accuracy-v1"]

[[analysis_policies]]
id = "proxy_metrics"
transformation_ids = ["answer-likelihood-proxies-v1", "recipe-ranking-v1", "unordered-pair-accuracy-v1"]

[[analysis_policies]]
id = "noise_spread"
transformation_ids = ["task-score-v1", "sample-seed-sd-v1", "recipe-spread-v1"]

[[analysis_policies]]
id = "scaling_law"
transformation_ids = ["paper-eight-fit-variants-v1", "one-billion-prediction-v1", "prediction-error-v1", "unordered-pair-accuracy-v1"]

[outputs]
runs_root = "data/paper-validation/runs"
report = "docs/paper-validation-report.md"
figures_root = "docs/paper/validation-figures"

