predicate = "directional"
parameters = [
  { name = "accuracy_threshold", default = 0.8, sensitivity_grid = [0.75, 0.8, 0.85] },
  { name = "compute_ratio_threshold", default = 10.0, sensitivity_grid = [3.0, 10.0, 30.0] },
]

[[comparison_rules]]
id = "dd-0168-markedly-less-reliable-v1"
version = 1
predicate = "directional"
parameters = [{ name = "marked_gap_minimum", default = 0.05, sensitivity_grid = [0.05] }]

[[comparison_rules]]
id = "dd-0174-fixed-compute-task-range-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "fixed_compute_range_minimum", default = 0.2, sensitivity_grid = [0.2] }]

[[comparison_rules]]
id = "dd-0175-five-orders-predictable-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "accuracy_threshold", default = 0.8, sensitivity_grid = [0.75, 0.8, 0.85] },
  { name = "compute_ratio_threshold", default = 100000.0, sensitivity_grid = [100000.0] },
]

[[comparison_rules]]
id = "dd-0176-boolq-intermediate-only-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "chance_baseline", default = 0.5, sensitivity_grid = [0.5] },
  { name = "trivial_tolerance", default = 0.05, sensitivity_grid = [0.05] },
  { name = "nontrivial_accuracy_threshold", default = 0.55, sensitivity_grid = [0.55] },
]

[[comparison_rules]]
id = "plateau-then-rise-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "plateau_sse_improvement_minimum", default = 0.2, sensitivity_grid = [0.1, 0.2, 0.3] },
  { name = "early_slope_absolute_maximum", default = 0.02, sensitivity_grid = [0.02] },
  { name = "late_slope_minimum", default = 0.0, sensitivity_grid = [0.0] },
]

[[comparison_rules]]
id = "small-scale-proxy-equivalent-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "equivalence_difference_minimum", default = -0.0033333333333333335, sensitivity_grid = [-0.0033333333333333335] },
  { name = "maximum_scale_percent", default = 1.0, sensitivity_grid = [0.1, 1.0, 10.0] },
]

[[comparison_rules]]
id = "proxy-noise-spread-majority-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "fraction_threshold", default = 0.5, sensitivity_grid = [0.5, 0.6666666666666666, 0.8] }]

[[comparison_rules]]
id = "curve-similarity-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "spearman_minimum", default = 0.9, sensitivity_grid = [0.9] }]

[[comparison_rules]]
id = "strict-majority-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "fraction_threshold", default = 0.5, sensitivity_grid = [0.5, 0.6666666666666666, 0.8] }]

[[comparison_rules]]
id = "small-scale-strict-majority-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "fraction_threshold", default = 0.5, sensitivity_grid = [0.5, 0.6666666666666666, 0.8] },
  { name = "maximum_scale_percent", default = 1.0, sensitivity_grid = [0.1, 1.0, 10.0] },
]

[[comparison_rules]]
id = "two-trend-clusters-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "cluster_count", default = 2.0, sensitivity_grid = [2.0] },
  { name = "silhouette_minimum", default = 0.25, sensitivity_grid = [0.15, 0.25, 0.35] },
]

[[comparison_rules]]
id = "overlap-and-rise-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "overlap_range_maximum", default = 0.05, sensitivity_grid = [0.05] },
  { name = "ols_slope_minimum", default = 0.0, sensitivity_grid = [0.0] },
]

[[comparison_rules]]
id = "flat-then-converge-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "early_slope_absolute_maximum", default = 0.02, sensitivity_grid = [0.02] },
  { name = "convergence_tolerance", default = 0.05, sensitivity_grid = [0.05] },
]

[[comparison_rules]]
id = "last-decade-overtake-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "fraction_threshold", default = 0.5, sensitivity_grid = [0.5, 0.6666666666666666, 0.8] }]

[[comparison_rules]]
id = "adjacent-decline-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "decline_threshold", default = 0.0033333333333333335, sensitivity_grid = [0.0033333333333333335] }]

[[comparison_rules]]
id = "noise-spread-positive-association-v1"
version = 1
predicate = "directional"
parameters = [{ name = "spearman_minimum", default = 0.0, sensitivity_grid = [0.0] }]

[[comparison_rules]]
id = "one-billion-sd-most-tasks-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "standard_deviation_target", default = 0.02, sensitivity_grid = [0.02] },
  { name = "standard_deviation_tolerance", default = 0.01, sensitivity_grid = [0.01] },
  { name = "task_count", default = 10.0, sensitivity_grid = [10.0] },
  { name = "task_count_minimum_exclusive", default = 5.0, sensitivity_grid = [5.0] },
]

[[comparison_rules]]
id = "frequent-crossovers-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "fraction_threshold", default = 0.5, sensitivity_grid = [0.3333333333333333, 0.5, 0.6666666666666666] }]

[checkpoint_policy]
final_rule = "latest_common_complete"
completeness_dimensions = ["recipe", "seed", "task", "metric"]
one_step_across_universe = true

[sensitivity_policy]
preceding_common_complete_steps = 2
include_paper_step_when_present = true
fixed_before_computation = true

[[analysis_policies]]
id = "single_scale"
transformation_ids = ["mmlu-subject-macro-v1", "olmes-task-macro-v1", "recipe-ranking-v1", "unordered-pair-accuracy-v1"]

[[analysis_policies]]
id = "per_task"
transformation_ids = ["task-score-v1", "recipe-ranking-v1", "unordered-pair-accuracy-v1"]

[[analysis_policies]]
id = "proxy_metrics"
transformation_ids = ["answer-likelihood-proxies-v1", "recipe-ranking-v1", "unordered-pair-accuracy-v1"]

[[analysis_policies]]
id = "noise_spread"
transformation_ids = ["task-score-v1", "sample-seed-sd-v1", "recipe-spread-v1"]

[[analysis_policies]]
id = "scaling_law"
transformation_ids = ["paper-eight-fit-variants-v1", "one-billion-prediction-v1", "prediction-error-v1", "unordered-pair-accuracy-v1"]

[outputs]
runs_root = "data/paper-validation/runs"
report = "docs/paper-validation-report.md"
figures_root = "docs/paper/validation-figures"

