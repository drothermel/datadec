[paper]
arxiv_id = "2504.11393v2"
source_url = "https://arxiv.org/e-print/2504.11393v2"
archive_sha256 = "20dc7aa3f920fe465ddf2e12d6f72fff6e8bb3567f53e34f5555a6da138542d1"
source_root = "docs/paper"
entrypoint = "example_paper.tex"

[[inputs]]
id = "olmes_aggregate"
path = "processed/olmes.parquet"
remote_path = "olmes.parquet"
columns = ["data", "params", "seed", "step", "task", "tokens", "compute", "exact_parameter_count", "primary_metric", "logits_per_byte_corr", "acc_raw", "acc_per_token", "acc_per_char", "correct_prob", "correct_prob_per_token", "correct_prob_per_char", "margin", "margin_per_token", "margin_per_char", "total_prob", "total_prob_per_token", "total_prob_per_char", "norm_correct_prob", "norm_correct_prob_per_token", "norm_correct_prob_per_char"]

[[inputs]]
id = "olmes_choices"
path = "processed/olmes-details/{recipe}/choices.parquet"
remote_path = "olmes-details/{recipe}/choices.parquet"
columns = ["recipe", "params", "seed", "step", "task", "doc_id", "choice_index", "sum_logits", "num_tokens", "num_chars", "is_greedy", "sum_logits_uncond", "logits_per_token", "logits_per_char"]

[[inputs]]
id = "scaling_evaluations"
path = "processed/scaling-law/evaluations.parquet"
remote_path = "scaling-law/evaluations.parquet"
columns = ["recipe", "params", "seed", "step", "task", "tokens", "compute", "exact_parameter_count", "primary_metric", "logits_per_byte_corr"]

[[comparison_rules]]
id = "predicate-true-v1"
version = 1
predicate = "boolean_true"

[[comparison_rules]]
id = "directional-v1"
version = 1
predicate = "directional"

[[comparison_rules]]
id = "nonempty-paper-plot-v1"
version = 1
predicate = "nonempty_plot"

[[comparison_rules]]
id = "approximately-one-point-v1"
version = 1
predicate = "absolute_tolerance"
absolute_tolerance = 0.01
threshold_grid = [0.005, 0.01, 0.02]

[[comparison_rules]]
id = "rounded-one-decimal-v1"
version = 1
predicate = "rounded"
displayed_decimal_places = 1

[[comparison_rules]]
id = "dd-0010-strong-baseline-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "strong_baseline_threshold", default = 0.75, sensitivity_grid = [0.75] }]

[[comparison_rules]]
id = "dd-0164-positive-compute-trend-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "ols_slope_minimum", default = 0.0, sensitivity_grid = [0.0] },
  { name = "spearman_minimum", default = 0.0, sensitivity_grid = [0.0] },
]

[[comparison_rules]]
id = "dd-0165-compute-equivalent-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "equivalence_difference_minimum", default = -0.0033333333333333335, sensitivity_grid = [-0.0033333333333333335] }]

[[comparison_rules]]
id = "dd-0356-annotation-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "accuracy_threshold", default = 0.8, sensitivity_grid = [0.75, 0.8, 0.85] }]

[[comparison_rules]]
id = "dd-0051-task-compute-dependence-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "accuracy_threshold", default = 0.8, sensitivity_grid = [0.75, 0.8, 0.85] },
  { name = "compute_ratio_threshold", default = 10.0, sensitivity_grid = [10.0] },
]

[[comparison_rules]]
id = "dd-0052-matched-accuracy-cheaper-v1"
version = 1
predicate = "directional"
parameters = [{ name = "accuracy_threshold", default = 0.8, sensitivity_grid = [0.75, 0.8, 0.85] }]

[[comparison_rules]]
id = "dd-0053-low-reliability-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "low_reliability_maximum", default = 0.8, sensitivity_grid = [0.8] }]

[[comparison_rules]]
id = "dd-0142-nontrivial-except-boolq-v1"
version = 1
predicate = "boolean_true"
parameters = [{ name = "nontrivial_accuracy_threshold", default = 0.55, sensitivity_grid = [0.55] }]

[[comparison_rules]]
id = "dd-0149-small-scale-predictable-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "accuracy_threshold", default = 0.8, sensitivity_grid = [0.75, 0.8, 0.85] },
  { name = "maximum_scale_percent", default = 1.0, sensitivity_grid = [0.1, 1.0, 10.0] },
]

[[comparison_rules]]
id = "dd-0150-substantially-more-compute-v1"
version = 1
predicate = "directional"
parameters = [
  { name = "accuracy_threshold", default = 0.8, sensitivity_grid = [0.75, 0.8, 0.85] },
  { name = "compute_ratio_threshold", default = 10.0, sensitivity_grid = [3.0, 10.0, 30.0] },
]

[[comparison_rules]]
id = "dd-0166-task-threshold-ratio-v1"
version = 1
predicate = "boolean_true"
parameters = [
  { name = "accuracy_threshold", default = 0.8, sensitivity_grid = [0.75, 0.8, 0.85] },
  { name = "compute_ratio_threshold", default = 10.0, sensitivity_grid = [10.0] },
]

[[comparison_rules]]
