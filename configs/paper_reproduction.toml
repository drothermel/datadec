[olmes_analysis.comparison]
target_ties = "exclude"
predicted_ties = "count_as_incorrect"
basis = "paper"
description = "Target ties are outside the two-class universe; predicted ties within that universe count as incorrect."

[olmes_analysis.standard_deviation]
attempt_ddof = 1
within_recipe_noise_ddof = 1
spread_ddof = 1
basis = "repository_operationalized"
description = "The paper omits the SD convention; the repository uses sample standard deviations for attempts, within-recipe noise, and across-recipe spread."

[olmes_analysis.missing_data]
behavior = "record"
allow_complete_case = false
basis = "repository_operationalized"
description = "Missing inputs are recorded explicitly and never converted into silent complete-case comparisons."

[olmes_analysis.compute]
flops_per_token_per_parameter = 6
parameter_count_column = "exact_parameter_count"
token_count_column = "tokens"
target_training_tokens = 100000000000
denominator_scope = "single_target_run"
target_run_count = 1
target_compute_denominator = 706099200000000000000
basis = "paper"
description = "Compute is 6*N*D; the denominator is one final 1B target run, without multiplying by target seeds or recipes."

[outputs]
runs_root = "data/paper-reproduction/runs"
generated_results_root = "data/paper-reproduction/generated"
report = "docs/paper-reproduction-report.md"
reproduced_figures_root = "docs/paper/reproduced-figures"
observations_filename = "observations.json"
run_manifest_filename = "manifest.json"
