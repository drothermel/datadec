[paper]
arxiv_id = "2504.11393v2"
source_url = "https://arxiv.org/e-print/2504.11393v2"
archive_sha256 = "20dc7aa3f920fe465ddf2e12d6f72fff6e8bb3567f53e34f5555a6da138542d1"
source_root = "docs/paper"
entrypoint = "example_paper.tex"

[contracts]
catalog = "configs/catalog.toml"
sources = "configs/sources.toml"
olmes = "configs/olmes.toml"
scaling_law = "configs/scaling_law.toml"
published_results = "configs/published_results.toml"
claims_contract = "docs/paper/claims.toml"

[[methods]]
id = "paper_source_trace"
provenance = "paper_derived"
description = "Locate claims and source regions in the pinned active LaTeX source."
paper_elements = ["prose", "equations", "tables", "figures", "captions"]

[[methods]]
id = "external_citation_trace"
provenance = "paper_derived"
description = "Trace attributed propositions to the citation keys attached in the paper."
paper_elements = ["external_citations"]

[[methods]]
id = "final_artifact_identity"
provenance = "artifact_derived"
description = "Compare paper-facing values with pinned final author artifacts without treating the comparison as independent reproduction."
paper_elements = ["tables", "figures", "release_claims"]

[[methods]]
id = "suite_config_comparison"
provenance = "paper_derived"
description = "Compare the paper's suite configuration and displayed model-ladder values with the typed repository catalog."
paper_elements = ["tab:suite_stats", "sec:suite"]

[[methods]]
id = "olmes_aggregate_verification"
provenance = "paper_derived"
description = "Recompute aggregate OLMES facts under the typed OLMES analysis contract derived from the paper."
paper_elements = ["OLMES aggregate analysis"]

[[methods]]
id = "author_artifact_comparison"
provenance = "artifact_derived"
description = "Compare claims with author-produced downstream tables without treating those tables as independently recomputed evidence."
paper_elements = ["author downstream tables"]

[[methods]]
id = "artifact_inventory"
provenance = "artifact_derived"
description = "Audit the identities and declared contents of available author-produced release artifacts."
paper_elements = ["release claims", "artifact inventories"]

[[policies]]
id = "external_citation_scope"
status = "settled"
statement = "External literature claims receive citation-trace coverage, not independent verification of the cited work."

[[policies]]
id = "figure_evidence"
status = "settled"
statement = "Figure verification uses numerical data and semantics; exact rendered pixels are not required scientific evidence."

[[policies]]
id = "upstream_source_use"
status = "settled"
statement = "Author source may inform an explicitly pinned method interpretation but is never imported, executed, copied, or treated as a runtime dependency."

[[policies]]
id = "comparison_universe"
status = "unresolved"
statement = "Recipe pairs, target and prediction seeds, ties, abstentions, missing values, and incomplete pairs require claim-specific resolution."

[[policies]]
id = "compute_and_checkpoint"
status = "unresolved"
statement = "Target checkpoints, intermediate checkpoints, early-seed stopping, and model-size subsets require claim-specific resolution."

[[policies]]
id = "statistical_fit"
status = "unresolved"
statement = "Aggregation order, uncertainty convention, scaling-law variants, optimizer details, bounds, helper points, and fit failure handling require claim-specific resolution."

[[policies]]
id = "qualitative_predicates"
status = "unresolved"
statement = "Qualitative phrases require explicit claim-specific predicates before independent verification."

[[policies]]
id = "source_coverage_v1"
status = "settled"
statement = "Source-trace observations bind each claim to its hashed active-paper source region and do not claim independent reproduction."

[[policies]]
id = "citation_trace_v1"
status = "settled"
statement = "Citation-trace observations preserve the active citation keys for externally attributed claims and remain citation-dependent."

[[policies]]
id = "suite_config_v1"
status = "settled"
statement = "Suite configuration comparisons use the active paper table and the typed repository catalog, preserving contradictions as verdicts."

[[policies]]
id = "olmes_v1"
status = "settled"
statement = "Aggregate OLMES verification follows the typed olmes_analysis subtree; this policy does not settle scaling-law fitting."

[olmes_analysis]
target_model_size = "1B"
noise_model_size = "150M"

[olmes_analysis.recipes]
aliases = [
  "Dolma1.7",
  "Dolma1.7 (no code)",
  "Dolma1.7 (no math, code)",
  "Dolma1.7 (no Reddit)",
  "Dolma1.7 (no Flan)",
  "Dolma1.6++",
  "C4",
  "FineWeb-Pro",
  "FineWeb-Edu",
  "Falcon",
  "Falcon+CC",
  "Falcon+CC (QC 10%)",
  "Falcon+CC (QC 20%)",
  "Falcon+CC (QC Orig 10%)",
  "Falcon+CC (QC Tulu 10%)",
  "DCLM-Baseline",
  "DCLM-Baseline (QC 10%)",
  "DCLM-Baseline (QC 20%)",
  "DCLM-Baseline (QC 7%, FW3)",
  "DCLM-Baseline (QC 7%, FW2)",
  "DCLM-Baseline (QC FW 3%)",
  "DCLM-Baseline (QC FW 10%)",
  "DCLM-Baseline 25% / Dolma 75%",
  "DCLM-Baseline 50% / Dolma 50%",
  "DCLM-Baseline 75% / Dolma 25%",
]
basis = "paper"
description = "The OLMES analysis compares all 25 paper catalog recipes."

[olmes_analysis.seeds]
target_aliases = ["default", "large aux 2", "large aux 3"]
prediction_aliases = ["default", "small aux 2", "small aux 3"]
basis = "paper"
description = "Target rankings average the three large-model seeds; prediction attempts use the three small-model seeds."

[olmes_analysis.metrics]
target_column = "primary_metric"
proxy_columns = [
  "acc_raw",
  "acc_per_token",
  "acc_per_char",
  "correct_prob",
  "correct_prob_per_token",
  "correct_prob_per_char",
  "margin",
  "margin_per_token",
  "margin_per_char",
  "norm_correct_prob",
  "norm_correct_prob_per_token",
  "norm_correct_prob_per_char",
  "total_prob",
  "total_prob_per_token",
  "total_prob_per_char",
]
basis = "paper"
description = "The target plus five proxy bases in unnormalized, per-token, and per-character forms is the paper's 16-metric set."

